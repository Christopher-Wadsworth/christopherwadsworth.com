<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="letter_style.css">
</head>
<body>

    <!-- Password Screen -->
    <div id="password-screen">
        <input type="password" id="password" placeholder="Enter your code">
        <button onclick="checkPassword()">Enter</button>
        <p id="error"></p>
    </div>

    <!-- Envelope -->
    <div class="container" id="main-content" style="display: none;">
        <div class="envelope-wrapper">
            <div class="envelope">
                <div class="letter">
                    <div class="text">
                        <strong>Congratulations <span id="person-name">Person</span>!</strong>
                        <p>You have been chosen to take part in the WFam Taskmaster event this Thanksgiving!!!!</p>
                    </div>
                </div>
            </div>
            <div class="heart"></div>
        </div>
    </div>

</body>
    
   <script src="passwords.js"></script>
</html>
